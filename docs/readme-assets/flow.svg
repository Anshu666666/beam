<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="350" viewBox="0 0 1280 350" role="img" aria-label="How Beam works: PROBE with a HEAD request, SLICE the file into RFC 7233 byte intervals, QUEUE the chunks in a buffered channel, STREAM them through a bounded pool of 8 workers, TRACK progress lock-free with atomics over 50 ms SSE, ASSEMBLE with io.MultiReader and a 32 KB buffer, and VERIFY the SHA-256 checksum">
<title>Beam — How it works: Probe, Slice, Queue, Stream, Track, Assemble, Verify</title>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,"Cascadia Mono",monospace}
@keyframes packet{0%,8%{transform:translateX(0);opacity:0}14%{opacity:1}88%{opacity:1}96%,100%{transform:translateX(1150px);opacity:0}}
@keyframes packet2{0%,54%{transform:translateX(0);opacity:0}60%{opacity:1}92%{opacity:1}99%,100%{transform:translateX(1150px);opacity:0}}
.pkt{animation:packet 8.5s linear infinite}
.pkt2{animation:packet2 8.5s linear infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.pkt,.pkt2,.pulse{animation:none;opacity:0}}
</style>
